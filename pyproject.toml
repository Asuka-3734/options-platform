[project]
name = "sellput"
version = "0.2.0"
description = "Options Research Platform - sell put & beyond (M0 + M1-A)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pandas-market-calendars>=4.4",
    "yfinance>=1.7.0",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sellput"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not benchmark"]
markers = [
    "benchmark: performance benchmark tests (not run by default; see Spec §12-9)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
